[project]
name = "excel-agent"
version = "0.1.0"
description = "Agente local para crear libros de Excel desde informacion en texto."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1.2",
]

[project.scripts]
excel-agent = "excel_agent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
